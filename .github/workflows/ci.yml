# CI for cc-orchestrator: the deterministic gates that guard the security floor and the
# resource registry. Conventions mirrored from sydlexius/stillwater (pinned action SHAs,
# least-privilege permissions, persist-credentials: false, concurrency).
#
# Runs BOTH the ubuntu (GNU `stat -c`) and macos (BSD `stat -f`) legs on EVERY event,
# including every PR. The macos leg validates the guard's BSD `stat -f` branch - the first
# CI run caught exactly that divergence. The repo is PUBLIC, so GitHub-hosted runner minutes
# (macos included) are free and unmetered; the earlier private-repo cost guard (macos gated
# to trusted events + an optional self-hosted linux runner via the SELF_HOSTED_LINUX repo
# variable) is removed. shellcheck/ruff are platform-independent, so they run once (on
# ubuntu); the harnesses + self-test run on both legs.
name: CI

# pull_request has NO base-branch filter on purpose: a stacked PR (gh stack) targets the
# branch below it, not main, and a `branches: [main]` filter left it with no gate checks
# until GitHub retargeted it after the lower PR merged (#503). push stays main-only, so a
# feature-branch push is still covered once, by its PR's run, not twice.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # ubuntu covers the GNU `stat -c` branch and keeps the required check name
        # `gates (ubuntu-latest)`. The macOS leg (BSD `stat -f`) is sharded across runners
        # in `gates-macos-shard` below and reports its required name `gates (macos-latest)`
        # from the `gates-macos` aggregate job (#544); do not add it back to this matrix.
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # (The macOS bash 3.2 shim lives in `gates-macos-shard` below.)
      # ruff runs Linux-only (the `ruff (F,E741)` step is `if: runner.os == 'Linux'`),
      # so only install it there - no need to spend the macOS leg installing an unused tool.
      - name: Install ruff
        if: runner.os == 'Linux'
        run: pip install ruff

      # Platform-independent lint: run once, on Linux. (jq is preinstalled on both runners.)
      # shellcheck is pinned to v0.11.0 via the official koalaman image, digest-pinned
      # (linux/amd64) for immutability per the repo SHA-pin convention. Predicts a clean
      # local `shellcheck` v0.11.0 gate (the SC2015 drift that motivated #165).
      - name: shellcheck v0.11.0 (security guard + runtime scripts)
        if: runner.os == 'Linux'
        run: |
          scripts=(
            scripts/orchestrate-guard.sh scripts/orchestrate-steer.sh scripts/orchestrate-context-meter.sh
            scripts/orchestrate-feedback.sh scripts/orchestrate-status.sh scripts/orchestrate-authorize-merge.sh
            scripts/uat-autobuild.sh scripts/ship-gate-preflight.sh scripts/gh-api-get.sh
            scripts/gh-codeql-dismiss.sh scripts/gh-resolve-thread.sh scripts/gh-comment.sh
            scripts/gh-codeql-autofix.sh scripts/gh-delete-branch.sh scripts/gh-react.sh
            scripts/stale-branch-sweep.sh scripts/codoki-quota-watch.sh scripts/pr-watch.sh
            scripts/issue-watch.sh scripts/pr-unreplied-comments.sh scripts/pr-read-comments.sh
            scripts/reply-comment.sh scripts/resolve-threads.sh scripts/cleanup-worktree.sh
            scripts/patch-coverage.sh scripts/pr-codeql-autofixes.sh scripts/safe-push.sh
            scripts/pre-push-hook.sh scripts/prose-lint.sh scripts/cache-reclaim.sh
            scripts/base-freshness.sh scripts/open-pr-staleness-sweep.sh scripts/run-paths.sh
            scripts/cr-quota-watch.sh scripts/elmer-enqueue.sh scripts/elmer-triage.sh
            scripts/elmer-tick.sh scripts/stack-preflight.sh
          )
          docker run --rm -v "$GITHUB_WORKSPACE:/mnt" -w /mnt \
            koalaman/shellcheck@sha256:b9389b73c8f26f710a7171cb7d8848a34a9c1e07a7865e727c9ec4ce99f9a83f \
            "${scripts[@]}"

      - name: ruff (F,E741)
        if: runner.os == 'Linux'
        run: ruff check --select F,E741 scripts/orchestrate-*.py scripts/orchestrate_schemas.py scripts/finding_channel.py scripts/planner_classify.py scripts/gate-runner.py scripts/gate_pool.py scripts/prefs-coverage.py scripts/settings-scrub.py test-orchestrate-*.py test-finding-channel.py test-planner-classify.py test-gh-wrappers.py test-gh-react.py test-ship-gate-preflight.py test-pr-unreplied-comments.py test-pr-read-comments.py test-safe-push.py test-pr-watch.py test-issue-watch.py test-version-lockstep.py test-ci-gates-lockstep.py test-steer-nudge-length.py test-helper-deploy-coverage.py test-jq-quoting.py test-stale-branch-sweep.py test-codoki-quota-watch.py test-gate-runner.py test-gate-pool.py test-prefs-coverage.py test-prose-lint.py test-resolve-threads.py test-cache-reclaim.py test-patch-coverage.py test-base-freshness.py test-safe-push-freshness.py test-prep-pr-freshness.py test-open-pr-staleness-sweep.py test-run-paths.py test-cleanup-worktree.py test-cr-quota-watch.py test-elmer-enqueue.py test-elmer-triage.py test-elmer-tick.py test-bash32-constructs.py test-settings-scrub.py test-stack-preflight.py test-command-positional-args.py

      # HARNESSES + SELF-TESTS: run through gate-runner from .gates.toml, 4 wide.
      # The serial one-step-per-harness list cost 375s on macOS / 230s on ubuntu, all of it
      # subprocess spawn cost (no sleeps), so running the harnesses in parallel is the win.
      # .gates.toml is now the ONE list: a harness added there runs in CI with no ci.yml edit,
      # so the two can no longer drift. `exclusive = true` steps (steer's timing check,
      # elmer-tick's lock race) still run alone, exactly as they do locally.
      #
      # --skip is the ONLY way a .gates.toml step stays out of CI, and every --skip here is
      # checked by test-ci-gates-lockstep.py against its CI_SKIP table (each entry carries a
      # written reason). gate-runner refuses a --skip that names no step, so a renamed step
      # fails the run instead of silently re-entering or leaving CI.
      #   shellcheck, ruff: run above by the dedicated Linux steps (digest-pinned image, not a
      #     host shellcheck of whatever version the runner image ships).
      #   test-orchestrate-setup (macOS only): the setup/doctor harness exercises HOST-COUPLED
      #     wiring (settings cascade, tmux, guard execution, git repo state) that diverges on a
      #     fresh macOS runner - env-coupling, not a shipped-code bug - so it stays Linux-only.
      #
      # Keep each invocation on ONE `run:` line with no continue-on-error: the lockstep
      # harness parses exactly that shape and fails if either OS leg stops running it.
      - name: harnesses + self-tests (gate-runner, Linux)
        if: runner.os == 'Linux'
        run: python3 scripts/gate-runner.py --jobs 4 --skip shellcheck --skip ruff

  # The macOS leg, split into 3 shards that each run on their own runner (#544): the single
  # macOS step took 6m13s against a 10-minute timeout. `--shard K/N` partitions the
  # .gates.toml step list by a stable hash of the step NAME, so the shards need no list of
  # their own. test-ci-gates-lockstep.py proves the shards cover the leg's step list exactly
  # once: same N everywhere, K exactly 1..N, no continue-on-error. The name is NOT a
  # required check; `gates-macos` below reports the required context.
  gates-macos-shard:
    name: gates-macos-shard (${{ matrix.shard }}/3)
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # #463: macOS /bin/bash is 3.2, but the runner image puts a Homebrew bash 5 first on
      # PATH, so harnesses (`bash script`, `#!/usr/bin/env bash`) never ran the scripts under
      # the bash a stock Mac user has (#460: `mapfile` -> exit 127, CI green). GITHUB_PATH
      # PREPENDS for every later step, and this runs after setup-python so nothing added
      # later shadows it. `#!/bin/bash` scripts already hit 3.2. Nothing here needs bash 4.
      - name: macOS - run bash as /bin/bash 3.2
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

      # The shim must not silently stop applying (an image change, a later PATH edit).
      - name: macOS - assert bash is 3.x
        run: |
          command -v bash && bash --version | head -n1
          [ "$(bash -c 'echo "${BASH_VERSINFO[0]}"')" = 3 ] || { echo "::error::bash on PATH is not 3.x, the #463 shim stopped applying"; exit 1; }

      # The --skip set is the macOS CI_SKIP table; the --shard N matches the matrix length.
      # Both are checked by test-ci-gates-lockstep.py. ONE `run:` line, no continue-on-error.
      - name: harnesses + self-tests (gate-runner, macOS shard)
        run: python3 scripts/gate-runner.py --jobs 4 --shard ${{ matrix.shard }}/3 --skip shellcheck --skip ruff --skip test-orchestrate-setup

  # Reports the REQUIRED check context `gates (macos-latest)` now that the matrix no longer
  # produces it. `always()` so it runs (and fails) even when a shard failed or was cancelled:
  # a skipped aggregate would read as a missing check. The shard job's `result` is success only
  # when EVERY matrix leg succeeded; failure, cancelled and skipped all fail this job.
  gates-macos:
    name: gates (macos-latest)
    needs: gates-macos-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every macOS shard to have succeeded
        env:
          SHARD_RESULT: ${{ needs.gates-macos-shard.result }}
        run: |
          echo "macOS shard result: $SHARD_RESULT"
          [ "$SHARD_RESULT" = "success" ] || { echo "::error::macOS gate shards did not all succeed ($SHARD_RESULT)"; exit 1; }
