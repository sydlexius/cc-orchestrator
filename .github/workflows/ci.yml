# CI for cc-orchestrator: the deterministic gates that guard the security floor and the
# resource registry. Conventions mirrored from sydlexius/stillwater (pinned action SHAs,
# least-privilege permissions, persist-credentials: false, concurrency).
#
# Runs BOTH the ubuntu (GNU `stat -c`) and macos (BSD `stat -f`) legs on EVERY event,
# including every PR. The macos leg validates the guard's BSD `stat -f` branch - the first
# CI run caught exactly that divergence. The repo is PUBLIC, so GitHub-hosted runner minutes
# (macos included) are free and unmetered; the earlier private-repo cost guard (macos gated
# to trusted events + an optional self-hosted linux runner via the SELF_HOSTED_LINUX repo
# variable) is removed. shellcheck/ruff are platform-independent, so they run once (on
# ubuntu); the harnesses + self-test run on both legs.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Both legs on every event (public repo -> free GitHub-hosted minutes). ubuntu
        # covers the GNU `stat -c` branch; macos covers the BSD `stat -f` branch.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # ruff runs Linux-only (the `ruff (F,E741)` step is `if: runner.os == 'Linux'`),
      # so only install it there - no need to spend the macOS leg installing an unused tool.
      - name: Install ruff
        if: runner.os == 'Linux'
        run: pip install ruff

      # Platform-independent lint: run once, on Linux. (jq is preinstalled on both runners.)
      # shellcheck is pinned to v0.11.0 via the official koalaman image, digest-pinned
      # (linux/amd64) for immutability per the repo SHA-pin convention. Predicts a clean
      # local `shellcheck` v0.11.0 gate (the SC2015 drift that motivated #165).
      - name: shellcheck v0.11.0 (security guard + runtime scripts)
        if: runner.os == 'Linux'
        run: |
          scripts=(
            scripts/orchestrate-guard.sh scripts/orchestrate-steer.sh scripts/orchestrate-context-meter.sh
            scripts/orchestrate-feedback.sh scripts/orchestrate-status.sh scripts/orchestrate-authorize-merge.sh
            scripts/uat-autobuild.sh scripts/ship-gate-preflight.sh scripts/gh-api-get.sh
            scripts/gh-codeql-dismiss.sh scripts/gh-resolve-thread.sh scripts/gh-comment.sh
            scripts/gh-codeql-autofix.sh scripts/gh-delete-branch.sh scripts/gh-react.sh
            scripts/stale-branch-sweep.sh scripts/codoki-quota-watch.sh scripts/pr-watch.sh
            scripts/issue-watch.sh scripts/pr-unreplied-comments.sh scripts/pr-read-comments.sh
            scripts/reply-comment.sh scripts/resolve-threads.sh scripts/cleanup-worktree.sh
            scripts/patch-coverage.sh scripts/pr-codeql-autofixes.sh scripts/safe-push.sh
            scripts/pre-push-hook.sh scripts/prose-lint.sh scripts/cache-reclaim.sh
            scripts/base-freshness.sh scripts/open-pr-staleness-sweep.sh scripts/run-paths.sh
            scripts/cr-quota-watch.sh scripts/elmer-enqueue.sh scripts/elmer-triage.sh
            scripts/elmer-tick.sh
          )
          docker run --rm -v "$GITHUB_WORKSPACE:/mnt" -w /mnt \
            koalaman/shellcheck@sha256:b9389b73c8f26f710a7171cb7d8848a34a9c1e07a7865e727c9ec4ce99f9a83f \
            "${scripts[@]}"

      - name: ruff (F,E741)
        if: runner.os == 'Linux'
        run: ruff check --select F,E741 scripts/orchestrate-*.py scripts/orchestrate_schemas.py scripts/finding_channel.py scripts/planner_classify.py scripts/gate-runner.py scripts/prefs-coverage.py test-orchestrate-*.py test-finding-channel.py test-planner-classify.py test-gh-wrappers.py test-gh-react.py test-ship-gate-preflight.py test-pr-unreplied-comments.py test-pr-read-comments.py test-safe-push.py test-pr-watch.py test-issue-watch.py test-version-lockstep.py test-ci-gates-lockstep.py test-steer-nudge-length.py test-jq-quoting.py test-stale-branch-sweep.py test-codoki-quota-watch.py test-gate-runner.py test-prefs-coverage.py test-prose-lint.py test-resolve-threads.py test-cache-reclaim.py test-patch-coverage.py test-base-freshness.py test-safe-push-freshness.py test-prep-pr-freshness.py test-open-pr-staleness-sweep.py test-run-paths.py test-cleanup-worktree.py test-cr-quota-watch.py test-elmer-enqueue.py test-elmer-triage.py test-elmer-tick.py

      # Platform-sensitive: run on BOTH macOS (BSD stat) and Linux (GNU stat).
      # Must invoke via ./ so the self-test's "$0" re-invocation resolves
      # (bash orchestrate-guard.sh would make $0 a bare name -> 127).
      - name: guard self-test
        run: ./scripts/orchestrate-guard.sh --self-test

      # Advisory steering hook (#95): self-test is platform-sensitive (BSD/GNU stat in
      # marker_active), so run on both runners alongside the guard self-test.
      - name: steer self-test
        run: ./scripts/orchestrate-steer.sh --self-test

      - name: harness - guard
        run: python3 test-orchestrate-guard.py

      - name: harness - steer
        run: python3 test-orchestrate-steer.py

      - name: harness - steer nudge length
        run: python3 test-steer-nudge-length.py

      - name: harness - resources
        run: python3 test-orchestrate-resources.py

      # Pure classification logic (planner role, #11) - platform-independent, runs on both.
      - name: harness - planner-classify
        run: python3 test-planner-classify.py

      # Base-freshness wiring (#329/#330): safe-push's git-only gate (stubs git AND
      # asserts no gh is ever invoked) plus the /prep-pr prose wiring. Host-independent.
      - name: harness - safe-push-freshness
        run: python3 test-safe-push-freshness.py

      - name: harness - prep-pr-freshness
        run: python3 test-prep-pr-freshness.py

      # CI <-> .gates.toml lint lockstep (#364): the two enumerations are hand-maintained
      # and had drifted to 28-of-37 shellcheck coverage. Fails when they disagree either way.
      - name: harness - ci-gates-lockstep
        run: python3 test-ci-gates-lockstep.py

      # jq single-quote integrity: an apostrophe inside a single-quoted jq program
      # closes the shell quote. A PAIR of them re-opens it, so `bash -n` passes while
      # the program is silently corrupted -- which is why this needs its own gate
      # rather than a comment. Bit twice in #376, once inside the warning comment.
      - name: harness - jq-quoting
        run: python3 test-jq-quoting.py

      # P3-F gh-* wrappers (#24): black-box, stubs gh via PATH - platform-independent.
      - name: harness - gh-wrappers
        run: python3 test-gh-wrappers.py

      # Ship-gate oracle (#110): stubs gh + pr-unreplied-comments.sh via PATH/$HOME -
      # deterministic, host-independent, platform-independent. Runs on both.
      - name: harness - ship-gate-preflight
        run: python3 test-ship-gate-preflight.py

      # pr-unreplied-comments.sh (#132 outside-diff count + --audit; #93 staleness):
      # stubs gh (and GraphQL) via PATH, applies --jq with the real jq. Host-independent.
      - name: harness - pr-unreplied-comments
        run: python3 test-pr-unreplied-comments.py

      # pr-read-comments.sh optional [owner/repo] positional (#144): stubs gh via
      # PATH + a call-log, asserts slug-vs-comment-id disambiguation. Host-independent.
      - name: harness - pr-read-comments
        run: python3 test-pr-read-comments.py

      # safe-push.sh branch-arg validation (#35): stubs git via PATH, records pushes.
      - name: harness - safe-push
        run: python3 test-safe-push.py

      # pr-watch.sh CR-skip + Codoki settlement wiring (#34, #110): stubs gh + the
      # Codoki oracle; PR_WATCH_POLL_INTERVAL=0 drives the loop deterministically.
      - name: harness - pr-watch
        run: python3 test-pr-watch.py

      # The setup/doctor harness exercises HOST-COUPLED wiring (settings cascade, tmux,
      # guard execution, git repo state). On a fresh macOS runner doctor behaves differently
      # than on the dev mac or the ubuntu runner - env-coupling on the runner, not a
      # shipped-code bug - so run it on Linux only. macOS still covers the portability-
      # sensitive guard (incl. the BSD stat -f branch) + resources harnesses + self-test
      # above. The macOS-runner doctor divergence is tracked separately for root-cause.
      - name: harness - setup
        if: runner.os == 'Linux'
        run: python3 test-orchestrate-setup.py

      # Maildir feedback store (#149): temp-dir isolated, stubs nothing (real bash
      # mktemp/mv), incl. a 25-way concurrency test. Host-independent.
      - name: harness - feedback
        run: python3 test-orchestrate-feedback.py

      # Version lockstep: SKILL.md **Version** == plugin.json "version". Platform-independent.
      - name: harness - version-lockstep
        run: python3 test-version-lockstep.py

      # stale-branch-sweep.sh (#137) + codoki-quota-watch.sh (#70): stub gh/git via
      # PATH, host-independent. Wired here for parity with the CLAUDE.md gate list
      # (the #138 PR added the harnesses to CLAUDE.md but not to this workflow).
      - name: harness - stale-branch-sweep
        run: python3 test-stale-branch-sweep.py

      - name: harness - codoki-quota-watch
        run: python3 test-codoki-quota-watch.py

      # gate-runner.py (#169): builds throwaway git repos in temp dirs, drives
      # .gates.toml Form A/B + the fail-open fallback chain via a controlled PATH.
      # Host-independent, platform-independent.
      - name: harness - gate-runner
        run: python3 test-gate-runner.py

      # The elmer harnesses (the unattended review requester): enqueue/triage/tick.
      # PLATFORM-SENSITIVE and therefore on BOTH legs, which is the whole point of
      # wiring them here - the tick reads a lock's mtime and inode via stat, and a
      # BSD-first `stat -f` order silently succeeds-with-garbage on GNU coreutils, so
      # stale-lock recovery never fired on Linux. That defect shipped CI-green purely
      # because these three lived in .gates.toml only and the ubuntu leg never ran
      # them. Every dependency (gh, the quota helper, the composed read-only helpers)
      # is stubbed via PATH/$ELMER_* and the maildir is a temp dir, so nothing here
      # touches the network or the real queue.
      - name: harness - cr-quota-watch
        run: python3 test-cr-quota-watch.py

      - name: harness - elmer-enqueue
        run: python3 test-elmer-enqueue.py

      - name: harness - elmer-triage
        run: python3 test-elmer-triage.py

      - name: harness - elmer-tick
        run: python3 test-elmer-tick.py
